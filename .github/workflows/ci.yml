name: CI

on:
  push:
    branches:
      - develop
      - "feat/**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  # 1. Lint + Build TypeScript
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

  # 2. Audit des dépendances (sécurité)
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Audit dependencies
        working-directory: backend
        run: npm audit --audit-level=high
        # Le job échoue uniquement si des vulnérabilités HIGH ou CRITICAL sont trouvées

  # Scan de secrets (Gitleaks)
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour scanner tout l'historique git

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build de l'image Docker (vérification)
 
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [dependency-audit, secret-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false # On build sans pousser pour l'instant
          tags: gestio-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Scan de l'image Docker (Trivy)
    trivy-scan:
      name: Trivy Image Scan
      runs-on: ubuntu-latest
      needs: docker-build

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build image for scanning
          uses: docker/build-push-action@v5
          with:
            context: ./backend
            push: false
            load: true
            tags: gestio-backend:scan

        - name: Run Trivy vulnerability scanner
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: gestio-backend:scan
            format: table
            exit-code: 1
            severity: HIGH,CRITICAL
            ignore-unfixed: true